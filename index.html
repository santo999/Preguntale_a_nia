<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Prototipo de alta resolución de Pregúntale a Nia: aprende a usar la inteligencia artificial en tu negocio.">
<meta name="theme-color" content="#0F6B5C">
<title>Pregúntale a Nia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230F6B5C'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='38' font-weight='700' text-anchor='middle' fill='white'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: una columna de app móvil (máx. 430px) con barra de pestañas fija abajo; en escritorio se centra como un teléfono. */
:root {
  --bg: #E9F0EC;
  --surface: #FFFFFF;
  --surface-2: #F4F8F6;
  --ink: #16302A;
  --muted: #4F6A63;
  --line: #D3E0DA;
  --brand: #0F6B5C;
  --brand-ink: #FFFFFF;
  --brand-soft: #DCEFE8;
  --mango: #D98A1C;
  --mango-soft: #FCEBCF;
  --ok: #1D7F48;
  --ok-soft: #DCF2E4;
  --warn: #9A6410;
  --warn-soft: #FBEED3;
  --bad: #B8381F;
  --bad-soft: #F8DFD9;
  --shadow: 0 1px 2px rgba(15, 50, 42, .08), 0 8px 20px rgba(15, 50, 42, .07);
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
  --base: 17px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1513; --surface: #14221E; --surface-2: #19302A; --ink: #E5F1EC; --muted: #9DB7AF; --line: #2A403A;
    --brand: #3DB79C; --brand-ink: #07211B; --brand-soft: #173A32; --mango: #F0B357; --mango-soft: #3A2B12;
    --ok: #52C585; --ok-soft: #163A27; --warn: #E7B657; --warn-soft: #3A2E13; --bad: #F07C66; --bad-soft: #3E1D17;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1513; --surface: #14221E; --surface-2: #19302A; --ink: #E5F1EC; --muted: #9DB7AF; --line: #2A403A;
  --brand: #3DB79C; --brand-ink: #07211B; --brand-soft: #173A32; --mango: #F0B357; --mango-soft: #3A2B12;
  --ok: #52C585; --ok-soft: #163A27; --warn: #E7B657; --warn-soft: #3A2E13; --bad: #F07C66; --bad-soft: #3E1D17;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}
html { font-size: var(--base); }
html[data-letra="grande"] { --base: 19px; }
html[data-letra="muy-grande"] { --base: 21px; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--mango); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 1.75rem; font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
.app { max-width: 430px; margin: 0 auto; min-height: 100vh; background: var(--surface-2); position: relative; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.app.sin-tabs { padding-bottom: 24px; }
@media (min-width: 640px) { .app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }

/* barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; min-height: 56px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top h2 { flex: 1; min-width: 0; font-size: 1.15rem; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
.chip-proto { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 2px 8px; flex: none; }
.marca { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.marca b { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; color: var(--brand); }

/* contenido */
.screen { display: flex; flex-direction: column; gap: 18px; padding-block: 18px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card.destacada { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: var(--shadow); }
.card.destacada .muted { color: inherit; opacity: .85; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.eyebrow { font-size: .78rem; letter-spacing: .07em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.card.destacada .eyebrow { color: inherit; opacity: .85; }
.row { display: flex; align-items: center; gap: 10px; }
.row > .grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 18px; border-radius: 12px;
  border: 2px solid transparent; font-weight: 700; font-size: 1rem; text-decoration: none; text-align: center; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-primario { background: var(--brand); color: var(--brand-ink); }
.btn-mango { background: var(--mango); color: #1D1405; }
.btn-claro { background: var(--surface); color: var(--brand); border-color: var(--brand); }
.card.destacada .btn-claro { background: var(--brand-ink); color: var(--brand); border-color: var(--brand-ink); }
.btn-bloque { width: 100%; }
.btn-texto { background: none; border: none; color: var(--brand); font-weight: 700; padding: 8px 0; min-height: 44px; text-align: left; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
.pill.mango { background: var(--mango-soft); color: var(--warn); }
.pill.gris { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }

/* opciones de selección (onboarding) */
.opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opcion { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; min-height: 104px; }
.opcion svg { width: 30px; height: 30px; color: var(--brand); }
.opcion[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.opcion b { font-size: .98rem; line-height: 1.2; }
.lista-opciones { display: flex; flex-direction: column; gap: 10px; }
.lista-opciones .opcion { flex-direction: row; align-items: center; min-height: 60px; }
.pasos-onb { display: flex; gap: 6px; }
.pasos-onb span { height: 6px; flex: 1; border-radius: 999px; background: var(--line); }
.pasos-onb span.on { background: var(--brand); }

/* progreso */
.barra { height: 10px; background: var(--brand-soft); border-radius: 999px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--mango); border-radius: 999px; }
.card.destacada .barra { background: rgba(255, 255, 255, .25); }

/* accesos rápidos */
.accesos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.acceso { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left; min-height: 96px; }
.acceso svg { width: 26px; height: 26px; color: var(--brand); }
.acceso b { font-size: .98rem; line-height: 1.2; }

/* lecciones */
.modulo { display: flex; flex-direction: column; gap: 8px; }
.leccion { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: left; width: 100%; }
.leccion .estado { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface-2); border: 2px solid var(--line); color: var(--muted); }
.leccion .estado svg { width: 18px; height: 18px; }
.leccion.hecha .estado { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.leccion.actual { border-color: var(--brand); border-width: 2px; }
.leccion.actual .estado { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.leccion .grow b { display: block; line-height: 1.25; }

/* video */
.video { aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--radius); background: linear-gradient(135deg, var(--brand), #0B4D42); color: #fff; display: grid; place-items: center; position: relative; overflow: hidden; }
.video button { width: 72px; height: 72px; border-radius: 50%; border: none; background: rgba(255, 255, 255, .95); color: #0B4D42; display: grid; place-items: center; }
.video button svg { width: 30px; height: 30px; margin-left: 4px; }
.video .sub { position: absolute; left: 12px; right: 12px; bottom: 10px; font-size: .85rem; background: rgba(0, 0, 0, .45); padding: 4px 8px; border-radius: 6px; }
.pasos { counter-reset: paso; display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.pasos li { counter-increment: paso; display: flex; gap: 12px; align-items: flex-start; }
.pasos li::before { content: counter(paso); flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-weight: 700; display: grid; place-items: center; }
.beneficios { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.beneficios li { display: flex; gap: 10px; align-items: flex-start; }
.beneficios svg { width: 22px; height: 22px; color: var(--ok); flex: none; margin-top: 1px; }
.aviso { border-radius: 12px; padding: 12px 14px; background: var(--warn-soft); color: var(--ink); display: flex; gap: 10px; }
.aviso svg { width: 22px; height: 22px; color: var(--warn); flex: none; margin-top: 2px; }

/* instrucción para copiar */
.instruccion { background: var(--surface-2); border: 1px dashed var(--brand); border-radius: 12px; padding: 12px 14px; font-size: .98rem; white-space: pre-wrap; }

/* chat de Nia */
.chat { display: flex; flex-direction: column; gap: 12px; }
.msg { scroll-margin-top: 76px; max-width: 88%; padding: 12px 14px; border-radius: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg.nia { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 4px; align-self: flex-start; }
.msg.yo { background: var(--brand); color: var(--brand-ink); border-top-right-radius: 4px; align-self: flex-end; }
.nia-cab { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--brand); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--mango); color: #1D1405; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; flex: none; }
.sugerencias { display: flex; flex-wrap: wrap; gap: 8px; }
.sugerencia { border: 1px solid var(--brand); color: var(--brand); background: var(--surface); border-radius: 999px; padding: 8px 12px; font-size: .92rem; text-align: left; }
.entrada { position: sticky; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--surface-2); padding-block: 8px; display: flex; gap: 8px; }
.entrada input { flex: 1; min-width: 0; min-height: 52px; border-radius: 12px; border: 2px solid var(--line); padding: 0 14px; background: var(--surface); }
.mini-herr { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; background: var(--surface-2); }

/* fichas */
.ficha-lista { display: flex; flex-direction: column; gap: 10px; }
.ficha-item { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; text-align: left; width: 100%; }
.logo { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; flex: none; color: #fff; }
.tabla-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
tr:last-child td { border-bottom: none; }
.si { color: var(--ok); font-weight: 700; }
.no { color: var(--muted); }
.lim { color: var(--warn); font-weight: 700; }
.seccion-ficha { display: flex; flex-direction: column; gap: 6px; }
.seccion-ficha ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }

/* filtros */
.filtros { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.filtro { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; white-space: nowrap; font-weight: 700; color: var(--muted); }
.filtro[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

/* formulario */
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo label { font-weight: 700; }
.campo input, .campo select { min-height: 52px; border-radius: 12px; border: 2px solid var(--line); padding: 0 14px; background: var(--surface); font-size: 1.05rem; }
.resultado { background: var(--brand-soft); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.resultado .grande { font-family: var(--font-display); font-size: 2rem; font-weight: 800; color: var(--brand); font-variant-numeric: tabular-nums; }
.cuaderno { background: repeating-linear-gradient(var(--surface), var(--surface) 30px, var(--line) 31px); border: 1px solid var(--line); border-radius: 12px; padding: 6px 14px; font-variant-numeric: tabular-nums; }
.cuaderno div { display: flex; justify-content: space-between; height: 31px; align-items: center; }

/* semáforo */
.semaforo { display: flex; flex-direction: column; gap: 10px; }
.luz { border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; }
.luz .punto { width: 18px; height: 18px; border-radius: 50%; flex: none; margin-top: 3px; }
.luz.verde { background: var(--ok-soft); } .luz.verde .punto { background: var(--ok); }
.luz.amarilla { background: var(--warn-soft); } .luz.amarilla .punto { background: var(--mango); }
.luz.roja { background: var(--bad-soft); } .luz.roja .punto { background: var(--bad); }
.pregunta-quiz { display: flex; flex-direction: column; gap: 8px; }
.respuestas { display: flex; gap: 8px; flex-wrap: wrap; }
.respuestas button { flex: 1; min-width: 120px; min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; }
.feedback { border-radius: 10px; padding: 10px 12px; font-size: .95rem; }
.feedback.bien { background: var(--ok-soft); }
.feedback.mal { background: var(--bad-soft); }

/* planes */
.plan { border: 2px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.plan.recomendado { border-color: var(--mango); }
.plan .precio { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.plan ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }

/* logros */
.logros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.logro { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; font-size: .82rem; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.logro .medalla { width: 40px; height: 40px; border-radius: 50%; background: var(--mango-soft); color: var(--warn); display: grid; place-items: center; }
.logro.bloq { opacity: .5; }
.logro svg { width: 22px; height: 22px; }

/* segmentado */
.segmentado { display: flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
.segmentado button { flex: 1; min-height: 48px; border: none; background: var(--surface); font-weight: 700; }
.segmentado button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.switch { width: 56px; height: 32px; border-radius: 999px; border: none; background: var(--line); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--brand); }
.switch[aria-checked="true"]::after { left: 28px; }

/* celebración */
.celebra { text-align: center; align-items: center; padding-top: 40px; }
.celebra .medalla-grande { width: 120px; height: 120px; border-radius: 50%; background: var(--mango); color: #1D1405; display: grid; place-items: center; }
.celebra .medalla-grande svg { width: 60px; height: 60px; }

/* bienvenida */
.hero { background: var(--brand); color: var(--brand-ink); margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 40px); padding-bottom: 32px; border-radius: 0 0 28px 28px; }
.hero-in { display: flex; flex-direction: column; gap: 14px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.hero .logo-nia { width: 84px; height: 84px; border-radius: 24px; background: var(--mango); color: #1D1405; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 2.1rem; }
.hero h1 { font-size: 2.2rem; }
.hero p { font-size: 1.12rem; opacity: .92; }

/* pestañas */
.tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); z-index: 6;
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { border: none; background: none; min-height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .74rem; font-weight: 700; color: var(--muted); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--brand); }
.tab.nia-tab .burbuja { width: 48px; height: 48px; border-radius: 50%; background: var(--mango); color: #1D1405; display: grid; place-items: center; margin-top: -18px; box-shadow: var(--shadow); font-family: var(--font-display); font-weight: 800; font-size: 1rem; }

/* toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 12px 18px; border-radius: 12px; z-index: 20; max-width: min(92vw, 400px); font-weight: 700; box-shadow: var(--shadow); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: sube .2s ease-out; } @keyframes sube { from { transform: translate(-50%, 10px); opacity: 0; } } }
</style>
</head>
<body>

<div class="app" id="app">
  <div id="view"></div>
  <nav class="tabs" id="tabs" aria-label="Secciones">
    <button class="tab" data-ir="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Inicio</button>

        <div class="respuestas">${['Sí', 'No'].map((r) => `<button data-quiz="${i}" data-resp="${r}" aria-pressed="${quiz[i] === r}">${r}</button>`).join('')}</div>
        ${quiz[i] ? `<div class="feedback ${quiz[i] === q.ok ? 'bien' : 'mal'}">${esc(quiz[i] === q.ok ? q.bien : q.mal)}</div>` : ''}</div>`).join('')}
    </div>`;

  let llamada = { dia: null, hora: null, hecha: false };
  P.ayuda = () => `
    ${barra('Ayuda', 'inicio')}
    <div class="screen">
      <div class="card"><h3>Escríbele a un asesor</h3><p class="muted">Te responde una persona por WhatsApp, de lunes a sábado.</p>
        <button class="btn btn-primario" data-whatsapp>${I.ayuda} Escribir por WhatsApp</button></div>
      <div class="card"><h3>Agenda una llamada</h3><p class="muted">Incluida en el plan Acompañado.</p>
        <div class="filtros">${['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'].map((d) => `<button class="filtro" data-dia="${d}" aria-pressed="${llamada.dia === d}">${d}</button>`).join('')}</div>
        <div class="filtros">${['8 a 10 a. m.', '2 a 4 p. m.', '6 a 8 p. m.'].map((h) => `<button class="filtro" data-hora="${h}" aria-pressed="${llamada.hora === h}">${h}</button>`).join('')}</div>
        <button class="btn btn-claro" data-agendar>${I.calendario} Pedir la llamada</button>
        ${llamada.hecha ? `<div class="feedback bien">En la versión final, un asesor te llamaría el ${llamada.dia.toLowerCase()} entre ${llamada.hora}.</div>` : ''}</div>
      <h2>Talleres presenciales</h2>
      ${[['Publicidad con IA para tiendas de barrio', 'Comuna 10 · sábados, 9:00 a. m.'], ['Cuentas e inventario con IA', 'Comuna 2 · sábados, 2:00 p. m.'], ['Uso seguro de la IA', 'Comuna 19 · miércoles, 6:00 p. m.']].map(([t, d]) => `
      <div class="card"><div class="row"><span style="color:var(--brand)">${I.calendario}</span><span class="grow"><b>${t}</b><br><span class="muted small">${d}</span></span></div><button class="btn btn-claro" data-taller="${t}">Quiero ir</button></div>`).join('')}
    </div>`;

  P.planes = () => `
    ${barra('Planes', 'aprender')}
    <div class="screen">
      <p class="muted">Tu plan actual: <b>Gratis</b></p>
      ${[
        { n: 'Gratis', p: 0, f: ['Fichas de herramientas de IA', 'Primeras lecciones de cada ruta', 'Módulo de uso seguro', 'Una lección por semana en WhatsApp'] },
        { n: 'Básico', p: 9900, f: ['Todas las lecciones de tu ruta', 'Todas las instrucciones y plantillas', 'Grupo de WhatsApp con comerciantes como tú'] },
        { n: 'Acompañado', p: 19900, rec: true, f: ['Todo lo del plan Básico', 'Asesoría personalizada cada mes', 'Talleres presenciales en tu comuna'] },
      ].map((pl) => `<div class="plan ${pl.rec ? 'recomendado' : ''}">
        <div class="row"><span class="grow"><h2>${pl.n}</h2></span>${pl.rec ? '<span class="pill mango">Con asesoría</span>' : ''}</div>
        <span class="precio">${pl.p ? pesos(pl.p) : '$0'}<span class="muted small" style="font-family:var(--font-body);font-weight:400"> al mes</span></span>
        <ul>${pl.f.map((x) => `<li>${x}</li>`).join('')}</ul>
        <button class="btn ${pl.n === 'Gratis' ? 'btn-claro' : 'btn-primario'}" data-plan="${pl.n}">${pl.n === 'Gratis' ? 'Plan actual' : 'Elegir ' + pl.n}</button></div>`).join('')}
    </div>`;

  P.perfil = () => `
    ${barra('Tu perfil')}
    <div class="screen">
      <div class="card"><span class="eyebrow">Tu negocio</span><h2>${esc(neg().nombre)}</h2><button class="btn-texto" data-ir="negocio">Cambiar tipo de negocio →</button></div>
      <h2>Logros</h2>
      <div class="logros">
        <div class="logro"><span class="medalla">${I.medalla}</span>Primera lección</div>
        <div class="logro"><span class="medalla">${I.escudo}</span>Uso seguro</div>
        <div class="logro"><span class="medalla">${I.estrella}</span>Racha de 3 días</div>
        <div class="logro bloq"><span class="medalla">${I.lista}</span>Ruta completa</div>
        <div class="logro bloq"><span class="medalla">${I.hoja}</span>Primera plantilla</div>
        <div class="logro bloq"><span class="medalla">${I.calendario}</span>Primer taller</div>
      </div>
      <h2>Tamaño de la letra</h2>
      <div class="segmentado" role="group" aria-label="Tamaño de letra">${[['normal', 'Normal'], ['grande', 'Grande'], ['muy-grande', 'Muy grande']].map(([v, t]) => `<button data-letra="${v}" aria-pressed="${S.letra === v}">${t}</button>`).join('')}</div>
      <div class="card">
        <div class="row"><span class="grow"><b>Recordatorios por WhatsApp</b><br><span class="muted small">Te enviamos la lección del día</span></span><button class="switch" role="switch" aria-checked="${S.recordatorio}" aria-label="Recordatorios por WhatsApp" data-switch></button></div>
        ${S.recordatorio ? `<div class="grid2">
          <div class="campo"><label for="rec-dia">Cuándo</label><select id="rec-dia" data-campo="dia">${['Todos los días', 'De lunes a viernes', 'Fines de semana'].map((d) => `<option ${S.dia === d ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
          <div class="campo"><label for="rec-hora">Hora</label><select id="rec-hora" data-campo="hora">${['6:00 a. m.', '7:00 a. m.', '12:00 m.', '8:00 p. m.'].map((h) => `<option ${S.hora === h ? 'selected' : ''}>${h}</option>`).join('')}</select></div>
        </div>` : ''}
      </div>
      <button class="btn btn-claro btn-bloque" data-ir="planes">Ver planes</button>
    </div>`;

  // ---------- enrutador ----------
  const SIN_TABS = ['bienvenida', 'negocio', 'metas', 'tiempo'];
  const TAB_DE = { inicio: 'inicio', aprender: 'aprender', leccion: 'aprender', practica: 'aprender', logro: 'aprender', planes: 'aprender', nia: 'nia', herramientas: 'herramientas', ficha: 'herramientas', perfil: 'perfil' };
  function rutaDeHash() {
    const h = (location.hash || '').replace('#', '');
    if (h.startsWith('ficha-') && HERRAMIENTAS[h.slice(6)]) { fichaVista = h.slice(6); return 'ficha'; }
    if (h.startsWith('leccion-') && leccion(h.slice(8).toUpperCase())) { leccionVista = h.slice(8).toUpperCase(); return 'leccion'; }
    return P[h] ? h : 'bienvenida';
  }
  function render(ruta) {
    document.getElementById('view').innerHTML = P[ruta]();
    const sin = SIN_TABS.includes(ruta);
    document.getElementById('tabs').hidden = sin;
    document.getElementById('app').classList.toggle('sin-tabs', sin);
    document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-current', TAB_DE[ruta] === t.dataset.ir ? 'page' : 'false'));
    if (ruta === 'precio') calcular();
  }
  function ir(ruta) {
    const destino = ruta === 'ficha' ? 'ficha-' + fichaVista : ruta === 'leccion' ? 'leccion-' + leccionVista.toLowerCase() : ruta;
    if (location.hash === '#' + destino) { render(ruta); } else { location.hash = destino; }
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', () => { render(rutaDeHash()); window.scrollTo(0, 0); });

  function calcular() {
    const c = parseFloat(String(document.getElementById('costo').value).replace(/\D/g, '')) || 0;
    const g = parseFloat(String(document.getElementById('ganancia').value).replace(/[^\d.]/g, '')) || 0;
    const precio = Math.ceil((c * (1 + g / 100)) / 50) * 50;
    document.getElementById('precio-res').textContent = pesos(precio);
    document.getElementById('precio-det').textContent = c ? `Ganas ${pesos(precio - c)} por cada unidad.` : 'Escribe el costo del producto.';
  }

  // ---------- eventos ----------
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button, [data-ir]'); if (!b) return;
    const d = b.dataset;
    if (d.ir) return ir(d.ir);
    if (d.negocio) { S.negocio = d.negocio; guardar(); return render('negocio'); }
    if (d.meta) { S.metas = S.metas.includes(d.meta) ? S.metas.filter((m) => m !== d.meta) : S.metas.concat(d.meta); guardar(); return render('metas'); }
    if (d.minutos) { S.minutos = +d.minutos; guardar(); return render('tiempo'); }
    if (d.letra) { S.letra = d.letra; document.documentElement.dataset.letra = d.letra; guardar(); return render(rutaDeHash()); }
    if (d.leccion) { leccionVista = d.leccion; const l = leccion(d.leccion); if (l.plan !== 'gratis' && !S.hechas.includes(l.id)) { toast('Esta lección es del plan Básico'); return ir('planes'); } return ir('leccion'); }
    if (d.video !== undefined) return toast('Reproduciendo video de la lección');
    if (d.copiar === 'practica') return copiar(document.getElementById('instr-practica').textContent);
    if (d.copiarI !== undefined) return copiar(conNegocio(INSTRUCCIONES[+d.copiarI].txt));
    if (d.abrir) return toast(`En la app final este botón abre ${d.abrir}`);
    if (d.terminar !== undefined) { if (!S.hechas.includes(leccionVista)) { S.hechas.push(leccionVista); S.racha += 1; guardar(); } return ir('logro'); }
    if (d.preguntar) return responder(d.preguntar);
    if (d.ficha) { fichaVista = d.ficha; return ir('ficha'); }
    if (d.filtro) { filtro = d.filtro; return render('instrucciones'); }
    if (d.fav !== undefined) { const i = +d.fav; S.favoritos = S.favoritos.includes(i) ? S.favoritos.filter((x) => x !== i) : S.favoritos.concat(i); guardar(); toast(S.favoritos.includes(i) ? 'Guardada en favoritos' : 'Quitada de favoritos'); return render('instrucciones'); }
    if (d.sheets) return toast('En la app final se abre la plantilla en Google Sheets');
    if (d.quiz !== undefined) { quiz[+d.quiz] = d.resp; return render('seguro'); }
    if (d.whatsapp !== undefined) return toast('En la app final este botón abre el chat con un asesor');
    if (d.dia) { llamada.dia = d.dia; llamada.hecha = false; return render('ayuda'); }
    if (d.hora) { llamada.hora = d.hora; llamada.hecha = false; return render('ayuda'); }
    if (d.agendar !== undefined) { if (!llamada.dia || !llamada.hora) return toast('Elige un día y una hora'); llamada.hecha = true; return render('ayuda'); }
    if (d.taller) return toast('Te avisaremos por WhatsApp la próxima fecha del taller');
    if (d.plan) return toast(d.plan === 'Gratis' ? 'Ya tienes el plan Gratis' : `En la app final aquí se paga el plan ${d.plan}`);
    if (d.switch !== undefined) { S.recordatorio = !S.recordatorio; guardar(); return render('perfil'); }
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'form-nia') return; e.preventDefault();
    const v = document.getElementById('pregunta-nia').value.trim(); if (v) responder(v);
  });
  document.addEventListener('input', (e) => { if (e.target.id === 'costo' || e.target.id === 'ganancia') calcular(); });
  document.addEventListener('change', (e) => { const c = e.target.dataset && e.target.dataset.campo; if (c) { S[c] = e.target.value; guardar(); } });

  render(rutaDeHash());
})();
</script>
</body>
</html>
